name: 공모 일일 자동 수집·배포

on:
  schedule:
    - cron: '30 21 * * *'   # 매일 06:30 KST (UTC 21:30)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Node.js 셋업
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 공모 수집 실행
        env:
          BIZINFO_API_KEY: ${{ secrets.BIZINFO_API_KEY }}
          NARA_API_KEY: ${{ secrets.NARA_API_KEY }}
          GOV24_API_KEY: ${{ secrets.GOV24_API_KEY }}
        run: node scripts/collect.js

      - name: 데이터 변경분 커밋(저장소 최신 유지)
        run: |
          git config user.name "gongmo-bot"
          git config user.email "noreply@github.com"
          git add assets/data/programs.json
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 건너뜀"
          else
            DAY=$(date -u -d '+9 hours' +'%Y-%m-%d')
            git commit -m "공모 일일 자동 수집 ($DAY)"
            # 수집에 5~7분이 걸린다. 그 사이 사람이 코드를 push하면 원격이 앞서서
            # push가 거부되고 배포까지 통째로 실패한다(2026-09-03 실제 발생).
            # 원격 변경분을 rebase로 따라잡고 재시도한다.
            # 커밋하는 건 programs.json(재생성물) 하나뿐이라, 충돌 시엔
            # 방금 수집한 쪽(-X theirs)을 택하는 것이 항상 옳다.
            pushed=0
            for i in 1 2 3; do
              if git push origin main; then pushed=1; break; fi
              echo "push 거부 — 원격 변경분 반영 후 재시도 ($i/3)"
              git pull --rebase -X theirs origin main || git rebase --abort || true
              sleep 5
            done
            if [ "$pushed" != "1" ]; then
              echo "::error::3회 재시도에도 push 실패" >&2
              exit 1
            fi
          fi

      - name: Netlify 배포
        run: npx --yes netlify-cli@17 deploy --prod --dir . --site "$NETLIFY_SITE_ID" --auth "$NETLIFY_AUTH_TOKEN"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
